kind = "web"
previewPath = "/"
title = "SnapMind"
version = "1.0.0"
id = "artifacts/snapmind"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21517

[services.development]
run = "pnpm --filter @workspace/snapmind run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/snapmind", "run", "build" ]
publicDir = "artifacts/snapmind/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21517"
BASE_PATH = "/"
